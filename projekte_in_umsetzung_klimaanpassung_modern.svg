  <path d="M181 112l14-20" fill="none" stroke="#176B4D" stroke-width="5" stroke-linecap="round"/>
  <path d="M194 92l7-9" fill="none" stroke="#176B4D" stroke-width="5" stroke-linecap="round"/>

  <!-- implementation / progress check -->
